<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Radial Cluster Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="stage">
      <div id="chart" class="chart"></div>
    </main>

    <aside class="panel" aria-label="Controls">
      <section class="panel-section">
        <h2 class="section-title">Find</h2>
        <div class="search">
          <input
            id="searchInput"
            type="search"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="searchList"
            aria-label="Search or browse nodes"
            placeholder="Search or browse…  ( / )"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="searchDropdown" class="dropdown" hidden>
            <nav id="searchCrumbs" class="crumbs" aria-label="Current level"></nav>
            <ul id="searchList" role="listbox" aria-label="Nodes"></ul>
          </div>
        </div>
      </section>

      <section class="panel-section">
        <h2 class="section-title">Tree</h2>
        <div class="button-row">
          <button type="button" id="btnExpandAll">Expand all</button>
          <button type="button" id="btnCollapseAll">Collapse all</button>
          <button type="button" id="btnReset">Reset</button>
        </div>
      </section>

      <section class="panel-section">
        <h2 class="section-title">View</h2>
        <div class="button-row">
          <button type="button" id="btnZoomOut" aria-label="Zoom out">−</button>
          <button type="button" id="btnZoomIn" aria-label="Zoom in">+</button>
          <button type="button" id="btnFit">Fit</button>
        </div>
      </section>

      <section class="panel-section">
        <h2 class="section-title">Layout</h2>
        <label class="field">
          <span class="field-label">
            Radius <output id="radiusValue" for="radiusSlider">1000</output>
          </span>
          <input
            id="radiusSlider"
            type="range"
            min="400"
            max="1800"
            step="50"
            value="1000"
          />
        </label>
        <label class="field">
          <span class="field-label">
            Arc height <output id="arcHeightValue" for="arcHeightSlider">1.5×</output>
          </span>
          <input
            id="arcHeightSlider"
            type="range"
            min="0"
            max="3"
            step="0.1"
            value="1.5"
          />
        </label>
      </section>

      <section class="panel-section">
        <h2 class="section-title">Appearance</h2>
        <label class="field field-inline">
          <span class="field-label">Label size</span>
          <select id="labelSize">
            <option value="10">Small</option>
            <option value="14" selected>Medium</option>
            <option value="18">Large</option>
            <option value="22">X-Large</option>
            <option value="30">XX-Large</option>
          </select>
        </label>
        <label class="field field-inline">
          <span class="field-label">Node size</span>
          <select id="nodeSize">
            <option value="0.75">Small</option>
            <option value="1" selected>Medium</option>
            <option value="1.5">Large</option>
            <option value="2">X-Large</option>
            <option value="3">XX-Large</option>
          </select>
        </label>
        <label class="field field-check">
          <input id="toggleLeafLinks" type="checkbox" checked />
          Show connections
        </label>
      </section>

      <section class="panel-section">
        <h2 class="section-title">Legend</h2>
        <ul class="legend">
          <li>
            <span class="swatch collapsed"></span>
            <span>Collapsed <small>double-click to expand</small></span>
          </li>
          <li>
            <span class="swatch expanded"></span>
            <span>Expanded <small>double-click to collapse</small></span>
          </li>
          <li>
            <span class="swatch leaf"></span>
            <span>Leaf <small>no children</small></span>
          </li>
          <li>
            <span class="swatch selected"></span>
            <span>Selected <small>click a node; Esc clears</small></span>
          </li>
        </ul>
      </section>
    </aside>

    <!-- D3 (pinned + integrity-checked) -->
    <script
      src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
      integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
      crossorigin="anonymous"
    ></script>
    <!-- App -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
