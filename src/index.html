<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Radial Cluster Demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <header class="topbar">
      <div class="left">
        <h1 class="title">Radial Cluster (Hierarchy)</h1>
        <p class="hint">
          Click a node to highlight its connections • Double-click to
          expand/collapse • Esc or click the background to clear •
          <kbd>/</kbd> to search
        </p>
      </div>

      <div class="controls">
        <form id="searchForm" class="control-group search" role="search">
          <input
            id="searchInput"
            type="search"
            list="nodeOptions"
            placeholder="Find node…"
            aria-label="Find node"
            autocomplete="off"
          />
          <datalist id="nodeOptions"></datalist>
        </form>

        <div class="control-group" role="group" aria-label="Tree">
          <span class="control-label">Tree</span>
          <button type="button" id="btnExpandAll">Expand all</button>
          <button type="button" id="btnCollapseAll">Collapse all</button>
          <button type="button" id="btnReset">Reset</button>
        </div>

        <div class="control-group" role="group" aria-label="View">
          <span class="control-label">View</span>
          <button type="button" id="btnZoomOut" aria-label="Zoom out">−</button>
          <button type="button" id="btnZoomIn" aria-label="Zoom in">+</button>
          <button type="button" id="btnFit">Fit</button>
        </div>

        <div class="control-group">
          <label class="control-label">
            Radius
            <input
              id="radiusSlider"
              type="range"
              min="400"
              max="1800"
              step="50"
              value="1000"
            />
          </label>
          <span id="radiusValue" class="control-value">1000</span>
        </div>

        <div class="control-group" role="group" aria-label="Label size">
          <span class="control-label">Labels</span>
          <button type="button" class="chip" data-label-size="10">S</button>
          <button type="button" class="chip is-active" data-label-size="14">
            M
          </button>
          <button type="button" class="chip" data-label-size="18">L</button>
          <button type="button" class="chip" data-label-size="22">XL</button>
          <button type="button" class="chip" data-label-size="30">XXL</button>
        </div>

        <div class="control-group">
          <label class="control-label">
            <input id="toggleLeafLinks" type="checkbox" checked />
            Connections
          </label>
        </div>
      </div>
    </header>

    <main class="stage">
      <div id="chart" class="chart"></div>
    </main>

    <!-- D3 (pinned + integrity-checked) -->
    <script
      src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
      integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
      crossorigin="anonymous"
    ></script>
    <!-- App -->
    <script type="module" src="./app.js"></script>
  </body>
</html>
